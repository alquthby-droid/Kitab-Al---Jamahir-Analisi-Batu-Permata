<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a09" />
      <stop offset="50%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="80%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.5" />

  <!-- Outer Islamic 8-Pointed Star (Rub el Hizb Inspired) -->
  <g transform="translate(256, 256) scale(1.15)">
    <rect x="-110" y="-110" width="220" height="220" rx="20" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-opacity="0.8" />
    <rect x="-110" y="-110" width="220" height="220" rx="20" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-opacity="0.8" transform="rotate(45)" />

    <!-- Gemstone Diamond Facets in Center -->
    <path d="M 0 -85 L 75 -25 L 50 65 L -50 65 L -75 -25 Z" fill="url(#emeraldGrad)" filter="url(#glow)" stroke="#fef08a" stroke-width="3" />
    
    <!-- Facet Lines -->
    <polygon points="0,-85 30,-25 0,20 -30,-25" fill="#a7f3d0" fill-opacity="0.6" />
    <polygon points="0,20 50,65 -50,65" fill="#047857" fill-opacity="0.9" />
    <polygon points="30,-25 75,-25 50,65 0,20" fill="#059669" fill-opacity="0.8" />
    <polygon points="-30,-25 -75,-25 -50,65 0,20" fill="#065f46" fill-opacity="0.8" />
    <polygon points="0,-85 75,-25 30,-25" fill="#d1fae5" fill-opacity="0.7" />
    <polygon points="0,-85 -75,-25 -30,-25" fill="#34d399" fill-opacity="0.7" />

    <!-- Sparkle Stars -->
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
    <path d="M 65 -65 Q 85 -65 85 -85 Q 85 -65 105 -65 Q 85 -65 85 -45 Q 85 -65 65 -65 Z" fill="#fef08a" />
    <path d="M -85 55 Q -70 55 -70 40 Q -70 55 -55 55 Q -70 55 -70 70 Q -70 55 -85 55 Z" fill="#fef08a" />
  </g>
</svg>
